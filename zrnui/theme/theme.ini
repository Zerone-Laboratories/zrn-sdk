; zrnui theme: the Windows Phone 8 / 8.1 colors, Dark and Light.
; Format: Name = #AARRGGBB (the notation of the WP8 theme files).
; Missing keys keep the built-in value; the file is found at $ZRNUI_THEME
; or next to the sources. Edit freely, no recompilation needed.

; the 20 accents of Windows Phone 8, in the KAccent enum order
[accent]
Lime = #FFA4C400
Green = #FF60A917
Emerald = #FF008A00
Teal = #FF00ABA9
Cyan = #FF1BA1E2
Cobalt = #FF0050EF
Indigo = #FF6A00FF
Violet = #FFAA00FF
Pink = #FFF472D0
Magenta = #FFD80073
Crimson = #FFA20025
Red = #FFE51400
Orange = #FFFA6800
Amber = #FFF0A30A
Yellow = #FFE3C800
Brown = #FF825A2C
Olive = #FF6D8764
Steel = #FF647687
Mauve = #FF76608A
Taupe = #FF87794E

[dark]
BACKGROUND = #FF000000   ; PhoneBackgroundColor
BASE_BLACK = #FF000000   ; PhoneBaseBlackColor (8.1)
BASE_LOW = #73FFFFFF   ; PhoneBaseLowColor
BASE_LOW_SOLID = #FF747474   ; PhoneBaseLowSolidColor
BASE_MEDIUM_HIGH = #CCFFFFFF   ; PhoneBaseMediumHighColor
BASE_MEDIUM_MID = #80FFFFFF   ; PhoneBaseMediumMidColor
BASE_MEDIUM_MID_SOLID = #FF666666   ; PhoneBaseMediumMidSolidColor
BASE_MID = #99FFFFFF   ; PhoneBaseMidColor
BASE_WHITE = #FFFFFFFF   ; PhoneBaseWhiteColor (8.1)
BORDER = #BFFFFFFF   ; PhoneBorderBrush
BUTTON_PRESSED_FOREGROUND = #FFFFFFFF   ; ButtonPressedForegroundThemeBrush
CHROME = #FF1F1F1F   ; PhoneChromeBrush
CONTENT_DIALOG_DIMMING = #99000000   ; ContentDialogDimmingThemeBrush (8.1)
CONTRAST_BACKGROUND = #FFFFFFFF   ; PhoneContrastBackgroundColor
CONTRAST_FOREGROUND = #FF000000   ; PhoneContrastForegroundColor
DISABLED = #66FFFFFF   ; PhoneDisabledColor
FOREGROUND = #FFFFFFFF   ; PhoneForegroundColor
INACTIVE = #33FFFFFF   ; PhoneInactiveColor
LIST_BOX_FOREGROUND = #FF000000   ; ListBoxForeground (8.1)
PHONE_DISABLED = #66FFFFFF   ; PhoneDisabledColor (8.1)
PROGRESS_BAR_BACKGROUND = #19FFFFFF   ; ProgressBarBackgroundBrush
SEMITRANSPARENT = #AA000000   ; PhoneSemitransparentBrush
SLIDER_DECREASE_DISABLED = #FF666666   ; SliderBarDecreaseDisabledBackgroundThemeBrush (8.1)
SLIDER_THUMB = #FFFFFFFF   ; SliderThumbBackgroundThemeBrush (8.1)
SLIDER_THUMB_DISABLED = #FF999999   ; SliderThumbDisabledBackgroundThemeBrush (8.1)
SLIDER_TRACK = #FF1F1F1F   ; SliderTrackBackgroundThemeBrush (8.1)
SUBTLE = #99FFFFFF   ; PhoneSubtleColor
TEXT_BOX = #BFFFFFFF   ; PhoneTextBoxBrush (75% white in Dark)
TEXT_BOX_BACKGROUND_81 = #FFFFFFFF   ; TextBoxBackgroundThemeBrush (8.1)
TEXT_BOX_BORDER_81 = #FFFFFFFF   ; TextBoxBorderThemeBrush (8.1)
TEXT_BOX_EDIT_BACKGROUND = #FFFFFFFF   ; PhoneTextBoxEditBackgroundBrush
TEXT_BOX_FOCUSED_BACKGROUND_81 = #FFFFFFFF   ; TextBoxFocusedBackgroundThemeBrush (8.1)
TEXT_BOX_FOREGROUND = #FF000000   ; PhoneTextBoxForegroundColorBrush
TEXT_BOX_FOREGROUND_81 = #FF000000   ; TextBoxForegroundThemeBrush (8.1)
TEXT_BOX_PLACEHOLDER_81 = #FF909090   ; TextControlPlaceholderThemeBrush (8.1)
TEXT_BOX_READ_ONLY = #77000000   ; PhoneTextBoxReadOnlyBrush
TEXT_CARET = #FF000000   ; PhoneCaretBrush
TEXT_LOW = #73FFFFFF   ; PhoneLowColor
TEXT_MID = #99FFFFFF   ; PhoneMidColor
TEXT_OVER_ACCENT = #FFFFFFFF   ; text over the accent

